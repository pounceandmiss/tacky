# The port is put in by with_socks5.sh. Username auth, so the client's
# RFC 1929 path is what every test goes through.
logoutput: stderr
internal: 127.0.0.1 port = @PORT@
external: 127.0.0.1
socksmethod: username
clientmethod: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 127.0.0.1/32 to: 0.0.0.0/0
}
socks pass {
    from: 127.0.0.1/32 to: 0.0.0.0/0
    command: connect
    log: connect error
}
